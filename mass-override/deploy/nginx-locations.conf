# Inside the xyberrp.duckdns.org server block. Staging and production gates run side
# by side; the game scripts name one of the two bases (MassOverrideFeed.Url and the
# MassOverrideCastPost URLs), and the production package swaps the staging base for
# the production one (mass-override/release/mo-build-prod-11615.py).
location /mass-override-staging/ { proxy_pass http://127.0.0.1:11900/; proxy_read_timeout 15s; proxy_buffering off; }
location /mass-override/ { proxy_pass http://127.0.0.1:11901/; proxy_read_timeout 15s; proxy_buffering off; }
